[package]
name = "cube-libre"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A local-first smart cube workspace built with Dioxus"
publish = false

[workspace]
members = ["crates/cube-core", "crates/cube-ble"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[dependencies]
dioxus = { version = "0.7.10", default-features = false, features = ["minimal", "desktop"] }
cube-core = { path = "crates/cube-core" }
cube-ble = { path = "crates/cube-ble" }
tokio.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
debug = 0
incremental = false

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
